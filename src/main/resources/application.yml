server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8090}
  servlet:
    session:
      cookie:
        name: ECOLOOP_SESSION
        http-only: true
        same-site: lax
spring:
  threads:
    virtual:
      enabled: true
  application:
    name: ecoloop
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecoloop}
    username: ${DATABASE_USERNAME:ecoloop}
    password: ${DATABASE_PASSWORD:ecoloop}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: redis
    timeout: 7d
    redis:
      namespace: ecoloop:session
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
ecoloop:
  ai:
    provider: ${ECOLOOP_AI_PROVIDER:stub}
  upload:
    dir: ${ECOLOOP_UPLOAD_DIR:uploads/devices}
ai:
  roboflow:
    api-key: ${ROBOFLOW_API_KEY:}
    workflow: ${ROBOFLOW_WORKFLOW:abhishek-sondakar-k3rfj/e-waste-qmxtt-zuyip-1-yolo26n-t1}
